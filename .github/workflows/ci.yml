name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and NuGet consumer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify documentation, tests, packages and published consumer
        shell: pwsh
        run: ./eng/verify.ps1
      - name: Check formatting
        shell: pwsh
        run: ./eng/format.ps1 -Check

  linux:
    name: Debian container tests and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test
        run: docker build -t pdfgenerator:ci .
      - name: Verify published consumer with restricted runtime
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --network none --memory 2g --cpus 4
          pdfgenerator:ci --self-test --pdf --output /tmp/smoke
